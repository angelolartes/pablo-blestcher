<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula Virtual | Campo de Coach</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://i.postimg.cc/wyg31kb4/Chat-GPT-Image-10-ago-2026-19-54-18.png">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: { blue: '#3b82f6' } }
                }
            }
        }
    </script>
    <style>
        .glass-nav { background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(12px); }
        .video-container iframe { width: 100%; height: 100%; border-radius: 1rem; }
        .lesson-row:last-child { border-bottom: none; }
        .active-lesson { background-color: #eff6ff; border-left: 4px solid #3b82f6; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- Pantalla de Carga -->
    <div id="loader" class="fixed inset-0 bg-slate-900 z-[100] flex flex-col items-center justify-center text-white transition-opacity duration-500">
        <i class="fa-solid fa-spinner fa-spin text-5xl mb-4 text-blue-500"></i>
        <h2 class="text-xl font-bold">Cargando tu clase...</h2>
    </div>

    <!-- Navbar Minimalista -->
    <header class="fixed top-0 left-0 right-0 z-50 glass-nav border-b border-slate-200 text-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-4">
                    <a href="dashboard.html" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center transition-colors">
                        <i class="fa-solid fa-arrow-left"></i>
                    </a>
                    <span id="nav-course-title" class="font-bold text-slate-900 text-sm truncate max-w-[200px] sm:max-w-md">Cargando curso...</span>
                </div>
                <div class="flex items-center gap-3">
                    <span id="user-display" class="text-xs font-semibold text-slate-500 hidden sm:block">Usuario</span>
                    <div class="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-xs font-bold">
                        <i class="fa-solid fa-user"></i>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Contenido Principal Centrado -->
    <main class="flex-grow pt-24 pb-12 px-4 sm:px-6 lg:px-8 max-w-4xl mx-auto w-full">
        
        <!-- Header del Curso (Sin sección instructor) -->
        <div class="mb-8 bg-white p-6 sm:p-8 rounded-3xl border border-slate-200 shadow-sm flex flex-col sm:flex-row justify-between items-start gap-4">
            <div>
                <h1 id="course-title" class="text-2xl sm:text-3xl font-extrabold text-slate-900 mb-2">Cargando programa...</h1>
                <p id="course-desc" class="text-slate-600 text-sm leading-relaxed">...</p>
            </div>
            <!-- Botón PDF -->
            <a id="btn-download-pdf" href="#" target="_blank" class="hidden shrink-0 bg-slate-900 hover:bg-slate-800 text-white font-semibold text-xs py-3 px-5 rounded-xl transition-colors shadow-sm items-center gap-2">
                <i class="fa-solid fa-file-pdf text-red-400"></i> Descargar Material
            </a>
        </div>

        <!-- Reproductor de Video y Controles de Navegación -->
        <div class="mb-8">
            <div class="bg-black rounded-2xl aspect-video shadow-xl relative overflow-hidden video-container flex items-center justify-center" id="video-wrapper">
                <i class="fa-solid fa-play text-slate-700 text-6xl"></i>
            </div>
            
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mt-4 px-2 gap-4">
                <h2 id="current-video-title" class="text-lg font-bold text-slate-900">Seleccioná una clase para comenzar</h2>
                
                <!-- Botones Anterior y Siguiente -->
                <div class="flex items-center gap-2 hidden" id="video-nav-buttons">
                    <button id="btn-prev" onclick="navegarVideo(-1)" class="px-4 py-2 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 rounded-xl font-semibold text-sm transition-all disabled:opacity-40 disabled:cursor-not-allowed flex items-center gap-2 shadow-sm">
                        <i class="fa-solid fa-angle-left"></i> Anterior
                    </button>
                    <button id="btn-next" onclick="navegarVideo(1)" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-semibold text-sm transition-all disabled:opacity-40 disabled:cursor-not-allowed flex items-center gap-2 shadow-sm">
                        Siguiente <i class="fa-solid fa-angle-right"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Lista de Contenidos -->
        <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden mb-12">
            <!-- Título de la sección -->
            <div class="p-6 border-b border-slate-100 flex items-center gap-3 bg-slate-50">
                <div class="w-6 h-6 rounded-full bg-slate-200 flex items-center justify-center text-slate-400 text-[10px]">
                    <i class="fa-solid fa-check"></i>
                </div>
                <div>
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">On Demand</p>
                    <h2 class="text-lg font-bold text-slate-900">Contenido del Curso</h2>
                </div>
            </div>

            <!-- Contenedor donde se inyectan las clases -->
            <div class="p-2 sm:p-6 space-y-1" id="lista-clases-container">
                <p class="text-center text-sm text-slate-500 py-4">Cargando módulos...</p>
            </div>
        </div>

    </main>

    <footer class="bg-white text-slate-500 py-6 border-t border-slate-200 text-xs text-center mt-auto">
        <p>&copy; 2026 Pablo Blestcher. Todos los derechos reservados.</p>
    </footer>

    <!-- FIREBASE Y LÓGICA -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBhlXGxRBvJ1AfUdhyfK8sszZ742emq6SY",
            authDomain: "email-password-29af5.firebaseapp.com",
            projectId: "email-password-29af5",
            storageBucket: "email-password-29af5.firebasestorage.app",
            messagingSenderId: "16571008478",
            appId: "1:16571008478:web:0a8d45f865cfc1de64494f",
            measurementId: "G-KKR61PJ4EV"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const courseId = urlParams.get('id');

        if (!courseId) window.location.href = "dashboard.html";

        // Variables Globales
        window.modulosCurso = []; 
        window.currentVideoIndex = 0; // Para saber en qué video estamos

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('user-display').innerText = user.email;
                await validarAcceso(user);
            } else {
                window.location.href = "campo_de_coach.html";
            }
        });

        async function validarAcceso(user) {
            try {
                const userDocSnap = await getDoc(doc(db, "usuarios", user.uid));
                if (userDocSnap.exists()) {
                    const userData = userDocSnap.data();
                    const esAdmin = userData.rol === "admin";
                    const tieneCurso = userData.cursosComprados && userData.cursosComprados.includes(courseId);

                    if (esAdmin || tieneCurso) {
                        await cargarContenidoCurso();
                    } else {
                        alert("No tenés acceso a este curso.");
                        window.location.href = "dashboard.html";
                    }
                }
            } catch (error) {
                console.error(error);
                window.location.href = "dashboard.html";
            }
        }

        async function cargarContenidoCurso() {
            try {
                const cursoDocSnap = await getDoc(doc(db, "cursos", courseId));

                if (cursoDocSnap.exists()) {
                    const curso = cursoDocSnap.data();

                    // Rellenar cabecera
                    document.getElementById('nav-course-title').innerText = curso.titulo;
                    document.getElementById('course-title').innerText = curso.titulo;
                    document.getElementById('course-desc').innerText = curso.descripcionLarga || curso.descripcion;

                    // Mostrar PDF si existe
                    if (curso.pdf && curso.pdf.trim() !== "") {
                        const btnPdf = document.getElementById('btn-download-pdf');
                        btnPdf.classList.remove('hidden');
                        btnPdf.classList.add('inline-flex');
                        btnPdf.href = curso.pdf;
                    }

                    // Por ahora usamos modulosDinámicos, si no tiene creamos uno de prueba con su video actual
                    let modulos = curso.modulosDinámicos || [];
                    
                    if (modulos.length === 0 && curso.video) {
                        modulos = [{ titulo: "Clase Completa", url: curso.video, duracion: curso.horas || "00:00" }];
                    }

                    window.modulosCurso = modulos;
                    renderizarListaClases(modulos);

                    // Reproducir el primer video por defecto y mostrar botones
                    if (modulos.length > 0) {
                        document.getElementById('video-nav-buttons').classList.remove('hidden');
                        reproducirVideo(0);
                    } else {
                        document.getElementById('video-wrapper').innerHTML = `<div class="text-slate-500 text-sm text-center">No hay clases cargadas para este curso.</div>`;
                    }

                    // Ocultar loader
                    const loader = document.getElementById('loader');
                    loader.style.opacity = '0';
                    setTimeout(() => loader.style.display = 'none', 500);

                } else {
                    alert("El curso no existe.");
                    window.location.href = "dashboard.html";
                }
            } catch (error) {
                console.error(error);
                window.location.href = "dashboard.html";
            }
        }

        function renderizarListaClases(modulos) {
            const container = document.getElementById('lista-clases-container');
            if (modulos.length === 0) {
                container.innerHTML = `<p class="text-center text-sm text-slate-500 py-4">No hay contenido disponible.</p>`;
                return;
            }

            let html = '';
            modulos.forEach((mod, index) => {
                html += `
                <div id="clase-row-${index}" onclick="reproducirVideo(${index})" class="lesson-row flex items-center justify-between p-3 sm:p-4 hover:bg-blue-50 rounded-xl transition-colors cursor-pointer group border-b border-slate-100">
                    <div class="flex items-center gap-3">
                        <i class="fa-regular fa-circle-play text-blue-400 text-xl group-hover:text-blue-600"></i>
                        <span class="text-sm font-semibold text-blue-500 group-hover:underline">${mod.titulo}</span>
                    </div>
                    <span class="text-xs font-medium text-slate-500">${mod.duracion || 'N/A'}</span>
                </div>
                `;
            });
            container.innerHTML = html;
        }

        window.reproducirVideo = function(index) {
            const modulos = window.modulosCurso;
            if(!modulos || modulos.length === 0 || !modulos[index]) return;

            // Actualizar la variable global del índice actual
            window.currentVideoIndex = index;

            const mod = modulos[index];
            let videoUrl = mod.url;

            // Formatear YouTube
            if (videoUrl.includes('youtube.com/watch?v=')) {
                videoUrl = videoUrl.replace('youtube.com/watch?v=', 'youtube.com/embed/');
            } else if (videoUrl.includes('youtu.be/')) {
                videoUrl = videoUrl.replace('youtu.be/', 'youtube.com/embed/');
            }

            // Cambiar iframe y título
            document.getElementById('video-wrapper').innerHTML = `
                <iframe src="${videoUrl}" title="Reproductor de Video" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            `;
            document.getElementById('current-video-title').innerText = mod.titulo;

            // Poner estilo activo a la fila
            document.querySelectorAll('.lesson-row').forEach(el => el.classList.remove('active-lesson'));
            const fila = document.getElementById(`clase-row-${index}`);
            if(fila) fila.classList.add('active-lesson');

            // Actualizar botones de navegación (habilitar/deshabilitar)
            document.getElementById('btn-prev').disabled = (index === 0);
            document.getElementById('btn-next').disabled = (index === modulos.length - 1);
            
            // Subir la pantalla suavemente
            window.scrollTo({ top: document.getElementById('video-wrapper').offsetTop - 100, behavior: 'smooth' });
        };

        // Lógica de los botones Anterior/Siguiente
        window.navegarVideo = function(direccion) {
            const nuevoIndex = window.currentVideoIndex + direccion;
            if(nuevoIndex >= 0 && nuevoIndex < window.modulosCurso.length) {
                reproducirVideo(nuevoIndex);
            }
        };

    </script>
</body>
</html>
